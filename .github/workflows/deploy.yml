name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t simple-devops-app .

    - name: Success Message
      run: echo "Docker Image Built Successfully"
